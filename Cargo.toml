[package]
name = "observatory"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
