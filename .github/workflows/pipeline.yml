name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and rollout so an older commit cannot replace a newer one.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/node_modules/playwright-core/package.json') }}
      - name: Install Chromium, WebKit, and Linux dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Install Linux dependencies for cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload tested static client
        uses: actions/upload-artifact@v6
        with:
          name: client-static
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
      - name: Capture dashboard screenshots
        id: screenshots
        working-directory: frontend
        env:
          SCREENSHOT_WEBKIT: '1'
        run: npm run screenshots
      - name: Upload dashboard screenshots
        if: always() && steps.screenshots.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-screenshots
          path: frontend/test-results/screenshots
          if-no-files-found: error
          retention-days: 30
      - run: bash -n scripts/deploy.sh
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - name: Verify production image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: observatory:test
      - name: Playwright production image E2E
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          OBSERVATORY_CONTAINER_IMAGE: observatory:test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          if-no-files-found: ignore

  publish-server:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        uses: mucsi96/get-next-version@main
        with:
          prefix: server
          src: .
          ignore: frontend docs .github README.md AGENTS.md scripts
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.hasNextVersion == 'true'
      - uses: docker/login-action@v3
        if: steps.version.outputs.hasNextVersion == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.version.outputs.hasNextVersion == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}-server:${{ steps.version.outputs.version }}
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.hasNextVersion == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  publish-client:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        uses: mucsi96/get-next-version@main
        with:
          prefix: client
          src: frontend
      - uses: actions/download-artifact@v6
        with:
          name: client-static
          path: client-static
      - name: Package static client
        run: tar -czf client-static.tar.gz -C client-static .
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.hasNextVersion == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: client-static.tar.gz

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: [publish-server, publish-client]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/download-artifact@v6
        with:
          name: client-static
          path: client-static
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare static client
        id: client
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          storage=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name client-storage-config --query value -o tsv)
          runtime=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name client-runtime-config --query value -o tsv)
          node frontend/scripts/static-client.mjs client-static client-publish "$(jq -er '.assets_base_url' <<< "$storage")" "$runtime"
          echo "account=$(jq -er '.account_name' <<< "$storage")" >> "$GITHUB_OUTPUT"
      - name: Publish assets before index
        uses: azure/cli@v2
        env:
          STORAGE_ACCOUNT: ${{ steps.client.outputs.account }}
        with:
          inlineScript: |
            set -euo pipefail
            az storage blob upload-batch --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --destination assets --source client-publish/assets --overwrite true \
              --content-cache-control no-cache --only-show-errors --output none
            az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --container-name '$web' --name index.html --file client-publish/documents/index.html \
              --overwrite true --content-type text/html --content-cache-control no-store \
              --only-show-errors --output none
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'
      - uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}
      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          SERVER_IMAGE: ghcr.io/${{ github.repository }}-server:${{ needs.publish-server.outputs.version }}
          CLIENT_CSP_FILE: client-publish/csp.txt
        run: bash scripts/deploy.sh
