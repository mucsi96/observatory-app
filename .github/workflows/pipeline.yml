name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and rollout so an older commit cannot replace a newer one.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            test/package-lock.json
            mock_upstream_server/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - run: go vet ./...
        working-directory: server
      - run: npm ci
        working-directory: test
      - run: npx tsc --noEmit
        working-directory: test
      - run: npx playwright install --with-deps chromium
        working-directory: test
      - run: bash -n scripts/deploy.sh scripts/pod_up.sh scripts/pod_down.sh
      - name: Start real test stack
        run: bash scripts/pod_up.sh
      - name: Go race and PostgreSQL integration tests
        run: go test -race ./...
        working-directory: server
        env:
          TEST_DATABASE_HOST: localhost
      - run: npm test
        working-directory: test
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test/test-results/
            test/playwright-report/
      - name: Stop test stack
        if: always()
        run: bash scripts/pod_down.sh

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [server, client]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}
      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          SERVER_IMAGE: ghcr.io/${{ github.repository }}-server:sha-${{ github.sha }}
          CLIENT_IMAGE: ghcr.io/${{ github.repository }}-client:sha-${{ github.sha }}
        run: bash scripts/deploy.sh
